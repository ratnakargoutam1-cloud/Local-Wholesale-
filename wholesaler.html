<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wholesaler Dashboard - Local Wholesale</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
    }

    .logout {
      border: none;
      background: white;
      color: #2563eb;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .welcome h3 {
      margin: 0 0 5px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-btn {
      border: none;
      padding: 16px 10px;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    .section {
      display: none;
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-top: 0;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .product-info p {
      margin: 3px 0;
      color: #555;
      font-size: 14px;
    }

    .danger {
      border: none;
      background: #dc2626;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .edit {
      border: none;
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      margin-right: 5px;
    }

    .customer-card,
    .order-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .order-item {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f7f7f7;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .order-item img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 7px;
      background: #ddd;
    }

    select {
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin-top: 5px;
      width: 100%;
    }

    .save-btn {
      border: none;
      background: #16a34a;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .add-product-btn {
      display: block;
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .message {
      padding: 15px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-card {
        align-items: flex-start;
      }

      .product-card > div:last-child {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .edit {
        margin-right: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>🏪 Local Wholesale</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h3 id="shopName">Loading...</h3>
    <div id="ownerName">Wholesaler Dashboard</div>
  </div>

  <div class="stats">

    <div class="stat">
      📦 Products
      <strong id="productCount">0</strong>
    </div>

    <div class="stat">
      🛒 Orders
      <strong id="orderCount">0</strong>
    </div>

    <div class="stat">
      👥 Customers
      <strong id="customerCount">0</strong>
    </div>

    <div class="stat">
      💰 Sales
      <strong id="salesTotal">₹0</strong>
    </div>

  </div>

  <button
    class="add-product-btn"
    onclick="openAddProduct()"
  >
    ➕ Add Product
  </button>

  <div class="actions">

    <button
      class="action-btn"
      onclick="showSection('productsSection'); loadProducts();"
    >
      🛍️ My Products
    </button>

    <button
      class="action-btn"
      onclick="showSection('customersSection'); loadCustomers();"
    >
      👥 Customers
    </button>

    <button
      class="action-btn"
      onclick="showSection('deliverySection'); loadDeliveryOrders();"
    >
      🚚 Delivery Status
    </button>

    <button
      class="action-btn"
      onclick="showSection('ordersSection'); loadOrders();"
    >
      📦 Orders
    </button>

  </div>


  <!-- MY PRODUCTS -->

  <section
    id="productsSection"
    class="section"
  >

    <h2>🛍️ My Products</h2>

    <div id="productsList">
      <div class="message">
        Products load हो रहे हैं...
      </div>
    </div>

  </section>


  <!-- CUSTOMERS -->

  <section
    id="customersSection"
    class="section"
  >

    <h2>👥 Customers</h2>

    <div id="customersList">
      <div class="message">
        Customers load हो रहे हैं...
      </div>
    </div>

  </section>


  <!-- DELIVERY -->

  <section
    id="deliverySection"
    class="section"
  >

    <h2>🚚 Delivery Status</h2>

    <div id="deliveryList">
      <div class="message">
        Delivery orders load हो रहे हैं...
      </div>
    </div>

  </section>


  <!-- ORDERS -->

  <section
    id="ordersSection"
    class="section"
  >

    <h2>📦 Orders</h2>

    <div id="ordersList">
      <div class="message">
        Orders load हो रहे हैं...
      </div>
    </div>

  </section>

</div>


<script>

  const SUPABASE_URL =
    "https://izxvsvyvvtbaxtxgcfav.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;


  // =========================
  // INIT
  // =========================

  async function init() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "index.html";
      return;
    }

    currentUser = user;

    await loadProfile();
    await loadDashboardStats();

  }


  // =========================
  // PROFILE
  // =========================

  async function loadProfile() {

    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("full_name, shop_name, role")
      .eq("id", currentUser.id)
      .single();

    if (error) {
      console.error(error);
      return;
    }

    if (data.role !== "wholesaler") {
      alert("Wholesaler account required.");
      window.location.href = "retailer.html";
      return;
    }

    document.getElementById("shopName").textContent =
      data.shop_name || "My Wholesale Shop";

    document.getElementById("ownerName").textContent =
      data.full_name || "Wholesaler";

  }


  // =========================
  // DASHBOARD STATS
  // =========================

  async function loadDashboardStats() {

    const {
      count: productCount
    } = await supabaseClient
      .from("products")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("wholesaler_id", currentUser.id);

    document.getElementById("productCount").textContent =
      productCount || 0;


    const {
      data: orders
    } = await supabaseClient
      .from("orders")
      .select("id, total")
      .eq("wholesaler_id", currentUser.id);

    const orderList = orders || [];

    document.getElementById("orderCount").textContent =
      orderList.length;


    let sales = 0;

    orderList.forEach(order => {
      sales += Number(order.total || 0);
    });

    document.getElementById("salesTotal").textContent =
      "₹" + sales.toFixed(2);


    const retailerIds =
      [];

    for (const order of orderList) {

      const {
        data: orderData
      } = await supabaseClient
        .from("orders")
        .select("retailer_id")
        .eq("id", order.id)
        .single();

      if (
        orderData &&
        !retailerIds.includes(orderData.retailer_id)
      ) {
        retailerIds.push(orderData.retailer_id);
      }

    }

    document.getElementById("customerCount").textContent =
      retailerIds.length;

  }


  // =========================
  // SECTION
  // =========================

  function showSection(id) {

    document
      .querySelectorAll(".section")
      .forEach(section => {
        section.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

    window.scrollTo({
      top: document
        .getElementById(id)
        .offsetTop - 10,
      behavior: "smooth"
    });

  }


  // =========================
  // ADD PRODUCT
  // =========================

  function openAddProduct() {

    window.location.href =
      "add-product.html";

  }


  // =========================
  // MY PRODUCTS
  // =========================

  async function loadProducts() {

    const box =
      document.getElementById("productsList");

    box.innerHTML =
      '<div class="message">Products load हो रहे हैं...</div>';


    const {
      data,
      error
    } = await supabaseClient
      .from("products")
      .select(`
        id,
        product_name,
        category,
        description,
        price,
        unit,
        stock,
        image_url,
        is_active
      `)
      .eq("wholesaler_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      box.innerHTML =
        `<div class="message">
          ❌ ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      box.innerHTML =
        '<div class="message">अभी कोई product नहीं है।</div>';

      return;
    }


    box.innerHTML =
      data.map(product => {

        const image =
          product.image_url
            ? `<img
                class="product-img"
                src="${escapeHtml(product.image_url)}"
                alt="Product"
              >`
            : `<div class="product-img"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:30px;
                ">
                📦
              </div>`;


        return `
          <div class="product-card">

            ${image}

            <div class="product-info">

              <h3>
                ${escapeHtml(product.product_name)}
              </h3>

              <p>
                Category:
                ${escapeHtml(product.category)}
              </p>

              <p>
                Price:
                ₹${Number(product.price || 0).toFixed(2)}
                / ${escapeHtml(product.unit || "piece")}
              </p>

              <p>
                Stock:
                ${Number(product.stock || 0)}
              </p>

              <p>
                Status:
                ${product.is_active ? "Active" : "Inactive"}
              </p>

            </div>

            <div>

              <button
                class="edit"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="danger"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </div>
        `;

      }).join("");

  }


  // =========================
  // EDIT PRODUCT
  // =========================

  async function editProduct(productId) {

    const newPrice =
      prompt("New price डालें:");

    if (newPrice === null) {
      return;
    }

    const price =
      Number(newPrice);

    if (isNaN(price) || price < 0) {
      alert("Invalid price.");
      return;
    }


    const newStock =
      prompt("New stock डालें:");

    if (newStock === null) {
      return;
    }

    const stock =
      Number(newStock);

    if (isNaN(stock) || stock < 0) {
      alert("Invalid stock.");
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("products")
      .update({
        price: price,
        stock: stock,
        updated_at: new Date().toISOString()
      })
      .eq("id", productId)
      .eq("wholesaler_id", currentUser.id);


    if (error) {

      alert(
        "Update failed: " +
        error.message
      );

      return;
    }


    alert("Product updated successfully.");

    await loadProducts();
    await loadDashboardStats();

  }


  // =========================
  // DELETE PRODUCT
  // =========================

  async function deleteProduct(productId) {

    const yes =
      confirm(
        "क्या आप इस product को delete करना चाहते हैं?"
      );

    if (!yes) {
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("products")
      .delete()
      .eq("id", productId)
      .eq("wholesaler_id", currentUser.id);


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;
    }


    alert("Product deleted.");

    await loadProducts();
    await loadDashboardStats();

  }


      }).join("");

  }

  // =========================
  // ORDERS
  // =========================

    const {
      data: items
    } = await supabaseClient
      .from("order_items")
      .select(`
        order_id,
        product_name,
        image_url,
        quantity,
        price
      `)
      .in("order_id", orderIds);


    const itemMap = {};


    (items || []).forEach(item => {

      if (!itemMap[item.order_id]) {
        itemMap[item.order_id] = [];
      }

      itemMap[item.order_id].push(item);

    });


    box.innerHTML =
      orders.map(order => {

        const orderItems =
          itemMap[order.id] || [];


        const itemsHtml =
          orderItems.map(item => {

            return `
              <div class="order-item">

                ${
                  item.image_url
                    ? `<img
                        src="${escapeHtml(item.image_url)}"
                      >`
                    : `<div
                        style="
                          width:55px;
                          height:55px;
                          display:flex;
                          align-items:center;
                          justify-content:center;
                          background:#ddd;
                          border-radius:7px;
                        "
                      >
                        📦
                      </div>`
                }

                <div>

                  <strong>
                    ${escapeHtml(item.product_name)}
                  </strong>

                  <div>
                    Qty:
                    ${Number(item.quantity || 0)}
                  </div>

                  <div>
                    ₹${Number(item.price || 0).toFixed(2)}
                  </div>

                </div>

              </div>
            `;

          }).join("");


        return `
          <div class="order-card">

            <h3>
              📦 Order #
              ${escapeHtml(
                order.id.substring(0, 8)
              )}
            </h3>

            <p>
              Total:
              <strong>
                ₹${Number(order.total || 0).toFixed(2)}
              </strong>
            </p>

            <p>
              Status:
              <strong>
                ${escapeHtml(order.status)}
              </strong>
            </p>

            <p>
              Delivery:
              <strong>
                ${escapeHtml(
                  order.delivery_status
                )}
              </strong>
            </p>

            <p>
              Payment:
              <strong>
                ${escapeHtml(
                  order.payment_status
                )}
              </strong>
            </p>

            <div>
              ${itemsHtml}
            </div>

          </div>
        `;

      }).join("");

  }


  // =========================
  // DELIVERY STATUS
  // =========================

  async function loadDeliveryOrders() {

    const box =
      document.getElementById("deliveryList");

    box.innerHTML =
      '<div class="message">Delivery orders load हो रहे हैं...</div>';


    const {
      data: orders,
      error
    } = await supabaseClient
      .from("orders")
      .select(`
        id,
        retailer_id,
        total,
        status,
        delivery_status,
        payment_status,
        created_at
      `)
      .eq("wholesaler_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      box.innerHTML =
        `<div class="message">
          ❌ ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!orders || orders.length === 0) {

      box.innerHTML =
        '<div class="message">अभी कोई delivery order नहीं है।</div>';

      return;
    }


    box.innerHTML =
      orders.map(order => {

        return `
          <div class="order-card">

            <h3>
              🚚 Order #
              ${escapeHtml(
                order.id.substring(0, 8)
              )}
            </h3>

            <p>
              Total:
              ₹${Number(order.total || 0).toFixed(2)}
            </p>

            <p>
              Order Status:
              ${escapeHtml(order.status)}
            </p>

            <label>
              Delivery Status
            </label>

            <select
              id="delivery-${order.id}"
            >

              <option
                value="pending"
                ${order.delivery_status === "pending" ? "selected" : ""}
              >
                Pending
              </option>

              <option
                value="preparing"
                ${order.delivery_status === "preparing" ? "selected" : ""}
              >
                Preparing
              </option>

              <option
                value="out_for_delivery"
                ${order.delivery_status === "out_for_delivery" ? "selected" : ""}
              >
                Out for Delivery
              </option>

              <option
                value="delivered"
                ${order.delivery_status === "delivered" ? "selected" : ""}
              >
                Delivered
              </option>

            </select>

            <label style="display:block;margin-top:10px;">
              Order Status
            </label>

            <select
              id="status-${order.id}"
            >

              <option
                value="pending"
                ${order.status === "pending" ? "selected" : ""}
              >
                Pending
              </option>

              <option
                value="accepted"
                ${order.status === "accepted" ? "selected" : ""}
              >
                Accepted
              </option>

              <option
                value="rejected"
                ${order.status === "rejected" ? "selected" : ""}
              >
                Rejected
              </option>

              <option
                value="completed"
                ${order.status === "completed" ? "selected" : ""}
              >
                Completed
              </option>

              <option
                value="cancelled"
                ${order.status === "cancelled" ? "selected" : ""}
              >
                Cancelled
              </option>

            </select>

            <button
              class="save-btn"
              onclick="updateOrder('${order.id}')"
            >
              💾 Save Status
            </button>

          </div>
        `;

      }).join("");

  }


  // =========================
  // UPDATE ORDER
  // =========================

  async function updateOrder(orderId) {

    const deliveryStatus =
      document.getElementById(
        "delivery-" + orderId
      ).value;


    const status =
      document.getElementById(
        "status-" + orderId
      ).value;


    const {
      error
    } = await supabaseClient
      .from("orders")
      .update({
        status: status,
        delivery_status: deliveryStatus
      })
      .eq("id", orderId)
      .eq("wholesaler_id", currentUser.id);


    if (error) {

      alert(
        "Status update failed: " +
        error.message
      );

      return;
    }


    alert("Order status updated successfully.");

    await loadDeliveryOrders();
    await loadOrders();
    await loadDashboardStats();

  }


  // =========================
  // LOGOUT
  // =========================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";

  }


  // =========================
  // ESCAPE HTML
  // =========================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(char) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[char];

        }
      );

  }


  // START

  init();

</script>
