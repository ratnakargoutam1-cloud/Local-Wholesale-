<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wholesaler Dashboard - Local Wholesale</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .orders-section {
      margin-top: 25px;
    }

    .order-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-products {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-product {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .product-image {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .product-info p {
      margin: 3px 0;
      font-size: 14px;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .status-row select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
    }

    .save-status {
      margin-top: 10px;
      width: 100%;
    }

    .empty-orders {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">

      <h1>🏪 Wholesaler Dashboard</h1>

      <p id="welcome">Welcome, Wholesaler</p>

      <div class="dashboard-grid">
        <button type="button"
          onclick="window.location.href='add-product.html'">
          ➕ Add Product
        </button>

        <button type="button"
          onclick="showOrders()">
          📦 Orders
        </button>

        <button type="button"
          onclick="alert('My Products section coming soon.')">
          🛍️ My Products
        </button>

        <button type="button"
          onclick="alert('Customers section coming soon.')">
          👥 Customers
        </button>

        <button type="button"
          onclick="alert('Delivery section coming soon.')">
          🚚 Delivery Status
        </button>
      </div>

      <p id="message" class="message"></p>

      <!-- ORDERS SECTION -->
      <section id="ordersSection" class="orders-section" style="display:none;">

        <h2>📦 My Orders</h2>

        <div id="ordersList">
          <div class="loading">Loading orders...</div>
        </div>

      </section>

      <button type="button" id="logoutBtn">
        Logout
      </button>

    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      'https://izxvsvyvvtbaxtxgcfav.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;


    async function loadDashboard() {

      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = user;


      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from('profiles')
        .select('full_name, shop_name, role')
        .eq('id', user.id)
        .single();


      if (
        profileError ||
        !profile ||
        profile.role !== 'wholesaler'
      ) {

        await supabaseClient.auth.signOut();

        window.location.href = 'index.html';

        return;
      }


      document.getElementById('welcome').textContent =
        `Welcome, ${profile.full_name || 'Wholesaler'}${
          profile.shop_name
            ? ' • ' + profile.shop_name
            : ''
        }`;
    }



    async function showOrders() {

      const section =
        document.getElementById('ordersSection');

      section.style.display = 'block';

      section.scrollIntoView({
        behavior: 'smooth'
      });


      await loadOrders();
    }



    async function loadOrders() {

      const ordersList =
        document.getElementById('ordersList');

      ordersList.innerHTML =
        '<div class="loading">Loading orders...</div>';


      if (!currentUser) {
        ordersList.innerHTML =
          '<div class="empty-orders">Please login again.</div>';
        return;
      }


      /*
        Wholesaler ke sirf usi ke orders
      */

      const {
        data: orders,
        error: ordersError
      } = await supabaseClient
        .from('orders')
        .select(`
          id,
          retailer_id,
          total,
          status,
          delivery_status,
          payment_status,
          created_at
        `)
        .eq('wholesaler_id', currentUser.id)
        .order('created_at', {
          ascending: false
        });


      if (ordersError) {

        console.error(ordersError);

        ordersList.innerHTML =
          `<div class="empty-orders">
            Orders load nahi ho paaye.<br>
            ${escapeHtml(ordersError.message)}
          </div>`;

        return;
      }


      if (!orders || orders.length === 0) {

        ordersList.innerHTML =
          `<div class="empty-orders">
            📦 Abhi koi order nahi hai.
          </div>`;

        return;
      }


      /*
        Retailer profiles load
      */

      const retailerIds =
        [...new Set(
          orders
            .map(order => order.retailer_id)
            .filter(Boolean)
        )];


      let retailerMap = {};


      if (retailerIds.length > 0) {

        const {
          data: retailers
        } = await supabaseClient
          .from('profiles')
          .select('id, full_name, shop_name, mobile')
          .in('id', retailerIds);


        (retailers || []).forEach(retailer => {

          retailerMap[retailer.id] =
            retailer;
        });
      }


      /*
        Order items load
      */

      const orderIds =
        orders.map(order => order.id);


      const {
        data: items,
        error: itemsError
      } = await supabaseClient
        .from('order_items')
        .select(`
          id,
          order_id,
          product_id,
          product_name,
          image_url,
          quantity,
          price
        `)
        .in('order_id', orderIds);


      if (itemsError) {

        console.error(itemsError);

        ordersList.innerHTML =
          `<div class="empty-orders">
            Product details load nahi ho paaye.<br>
            ${escapeHtml(itemsError.message)}
          </div>`;

        return;
      }


      const itemsByOrder = {};


      (items || []).forEach(item => {

        if (!itemsByOrder[item.order_id]) {
          itemsByOrder[item.order_id] = [];
        }

        itemsByOrder[item.order_id].push(item);

      });


      ordersList.innerHTML = '';


      orders.forEach(order => {

        const retailer =
          retailerMap[order.retailer_id] || {};

        const orderItems =
          itemsByOrder[order.id] || [];


        const orderCard =
          document.createElement('div');

        orderCard.className =
          'order-card';


        const createdDate =
          new Date(order.created_at)
            .toLocaleString('en-IN');


        let productsHtml = '';


        if (orderItems.length === 0) {

          productsHtml =
            '<p>No product details found.</p>';

        } else {

          productsHtml =
            orderItems.map(item => {

              const image =
                item.image_url
                  ? `<img
                       class="product-image"
                       src="${escapeHtml(item.image_url)}"
                       alt="${escapeHtml(item.product_name)}"
                     >`
                  : `<div
                       class="product-image"
                       style="display:flex;align-items:center;justify-content:center;"
                     >📦</div>`;


              const itemTotal =
                Number(item.price || 0) *
                Number(item.quantity || 0);


              return `
                <div class="order-product">

                  ${image}

                  <div class="product-info">

                    <h3>
                      ${escapeHtml(
                        item.product_name || 'Product'
                      )}
                    </h3>

                    <p>
                      Quantity:
                      ${Number(item.quantity || 0)}
                    </p>

                    <p>
                      Price:
                      ₹${Number(
                        item.price || 0
                      ).toFixed(2)}
                    </p>

                    <p>
                      Item Total:
                      ₹${itemTotal.toFixed(2)}
                    </p>

                  </div>

                </div>
              `;

            }).join('');
        }


        orderCard.innerHTML = `

          <div class="order-header">

            <div>
              <strong>
                Order #${escapeHtml(
                  order.id.substring(0, 8)
                )}
              </strong>

              <br>

              <small>
                ${escapeHtml(createdDate)}
              </small>
            </div>

            <div>
              <strong>
                ₹${Number(
                  order.total || 0
                ).toFixed(2)}
              </strong>
            </div>

          </div>


          <div>

            <strong>👤 Retailer</strong>

            <p>
              ${escapeHtml(
                retailer.full_name ||
                'Retailer'
              )}
              ${
                retailer.shop_name
                  ? ' • ' +
                    escapeHtml(
                      retailer.shop_name
                    )
                  : ''
              }
            </p>

            ${
              retailer.mobile
                ? `<p>📱 ${
                    escapeHtml(
                      retailer.mobile
                    )
                  }</p>`
                : ''
            }

          </div>


          <h3>🛍️ Products</h3>

          <div class="order-products">
            ${productsHtml}
          </div>


          <div class="status-row">

            <label>
              Order Status
              <select id="status-${order.id}">
                <option value="pending"
                  ${order.status === 'pending' ? 'selected' : ''}>
                  Pending
                </option>

                <option value="accepted"
                  ${order.status === 'accepted' ? 'selected' : ''}>
                  Accepted
                </option>

                <option value="rejected"
                  ${order.status === 'rejected' ? 'selected' : ''}>
                  Rejected
                </option>

                <option value="completed"
                  ${order.status === 'completed' ? 'selected' : ''}>
                  Completed
                </option>

                <option value="cancelled"
                  ${order.status === 'cancelled' ? 'selected' : ''}>
                  Cancelled
                </option>
              </select>
            </label>


            <label>
              Delivery Status
              <select id="delivery-${order.id}">
                <option value="pending"
                  ${order.delivery_status === 'pending' ? 'selected' : ''}>
                  Pending
                </option>

                <option value="preparing"
                  ${order.delivery_status === 'preparing' ? 'selected' : ''}>
                  Preparing
                </option>

                <option value="out_for_delivery"
                  ${order.delivery_status === 'out_for_delivery' ? 'selected' : ''}>
                  Out for Delivery
                </option>

                <option value="delivered"
                  ${order.delivery_status === 'delivered' ? 'selected' : ''}>
                  Delivered
                </option>
              </select>
            </label>


            <label>
              Payment Status
              <select id="payment-${order.id}">
                <option value="pending"
                  ${order.payment_status === 'pending' ? 'selected' : ''}>
                  Pending
                </option>

                <option value="paid"
                  ${order.payment_status === 'paid' ? 'selected' : ''}>
                  Paid
                </option>

                <option value="cod"
                  ${order.payment_status === 'cod' ? 'selected' : ''}>
                  COD
                </option>
              </select>
            </label>


            <button
              type="button"
              class="save-status"
              onclick="updateOrder(
                '${order.id}'
              )"
            >
              💾 Save Order Status
            </button>

          </div>

        `;


        ordersList.appendChild(orderCard);

      });

    }



    async function updateOrder(orderId) {

      const status =
        document.getElementById(
          `status-${orderId}`
        ).value;


      const delivery_status =
        document.getElementById(
          `delivery-${orderId}`
        ).value;


      const payment_status =
        document.getElementById(
          `payment-${orderId}`
        ).value;


      const {
        error
      } = await supabaseClient
        .from('orders')
        .update({
          status,
          delivery_status,
          payment_status
        })
        .eq('id', orderId)
        .eq('wholesaler_id', currentUser.id);


      if (error) {

        alert(
          'Status update nahi hua: ' +
          error.message
        );

        return;
      }


      alert('✅ Order status updated successfully!');

    }



    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }



    document
      .getElementById('logoutBtn')
      .addEventListener(
        'click',
        async () => {

          await supabaseClient
            .auth
            .signOut();

          window.location.href =
            'index.html';

        }
      );


    loadDashboard();

  </script>

</body>
</html>
