<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Wholesale - Add Product</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.preview{width:100%;height:190px;border:2px dashed #d8dee8;border-radius:14px;display:grid;place-items:center;overflow:hidden;margin:8px 0 14px;background:#fafbfc;color:#667085}.preview img{width:100%;height:100%;object-fit:contain}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.success{color:#18794e}.danger{color:#c62828}.small{font-size:12px;color:#667085}.primary:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
<main class="container">
<section class="card">
<h2>➕ Product Add Karein</h2>
<p class="small">Sirf wholesaler apne products yahan add kar sakta hai.</p>
<form id="productForm">
<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">
<div id="preview" class="preview">📷 Photo preview</div>
<label>Category</label>
<select id="category" required><option value="">Category select karein</option><option>Kirana/Grocery</option><option>Cold Drinks/Beverages</option><option>Cosmetics</option><option>Stationery</option><option>Electrical</option><option>Other</option></select>
<label>Product Name</label>
<input id="productName" type="text" placeholder="Jaise: Surf Excel 1kg" required>
<div class="grid2">
<div><label>Price (₹)</label><input id="price" type="number" min="0" step="0.01" required></div>
<div><label>Unit</label><select id="unit" required><option value="piece">Piece</option><option value="packet">Packet</option><option value="box">Box</option><option value="kg">Kg</option><option value="gram">Gram</option><option value="litre">Litre</option><option value="dozen">Dozen</option></select></div>
</div>
<label>Stock</label><input id="stock" type="number" min="0" step="0.01" value="0" required>
<label>Description</label><textarea id="description" rows="4" placeholder="Product ki jankari"></textarea>
<button class="primary" id="saveBtn" type="submit">Product Save Karein →</button>
</form>
<p id="message" class="message"></p>
</section>
</main>
<script>
const SUPABASE_URL='https://izxvsvyvvtbaxtxgcfav.supabase.co';
const SUPABASE_KEY='sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI';
const BUCKET='Product image';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let userId=null;

function showMessage(text, type=''){
 const el=document.getElementById('message'); el.textContent=text; el.className='message '+type;
}

async function init(){
 try{
  const {data:{user},error}=await supabaseClient.auth.getUser();
  if(error) throw error;
  if(!user){window.location.href='index.html';return;}
  userId=user.id;
  const {data:profile,error:profileError}=await supabaseClient.from('profiles').select('role').eq('id',user.id).single();
  if(profileError) throw profileError;
  if(!profile || profile.role!=='wholesaler'){
   showMessage('⚠️ Ye page sirf wholesaler ke liye hai.','danger');
   document.getElementById('productForm').style.display='none';
  }
 }catch(err){showMessage('⚠️ '+(err.message||'Page load nahi hua.'),'danger');}
}

document.getElementById('photo').addEventListener('change',function(){
 const file=this.files && this.files[0];
 const preview=document.getElementById('preview');
 if(!file){preview.textContent='📷 Photo preview';return;}
 if(!file.type.startsWith('image/')){showMessage('⚠️ Sirf image file select karein.','danger');this.value='';preview.textContent='📷 Photo preview';return;}
 const url=URL.createObjectURL(file);
 preview.innerHTML='';
 const img=document.createElement('img');
 img.src=url;
 img.onload=()=>URL.revokeObjectURL(url);
 preview.appendChild(img);
});

document.getElementById('productForm').addEventListener('submit',async function(e){
 e.preventDefault();
 e.stopPropagation();
 const btn=document.getElementById('saveBtn');
 btn.disabled=true; btn.textContent='Saving...'; showMessage('Product save ho raha hai...');
 try{
  if(!userId) throw new Error('User session nahi mili. Dobara login karein.');
  const file=document.getElementById('photo').files[0];
  let image_url=null;
  if(file){
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
   const path=userId+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;
   const {error:uploadError}=await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
   if(uploadError) throw new Error('Image upload failed: '+uploadError.message);
   const {data:urlData}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
   image_url=urlData.publicUrl;
  }
  const {error}=await supabaseClient.from('products').insert({
   wholesaler_id:userId,
   category:document.getElementById('category').value,
   product_name:document.getElementById('productName').value.trim(),
   price:Number(document.getElementById('price').value),
   unit:document.getElementById('unit').value,
   stock:Number(document.getElementById('stock').value),
   description:document.getElementById('description').value.trim()||null,
   image_url:image_url,
   is_active:true
  });
  if(error) throw new Error('Product save failed: '+error.message);
  showMessage('✅ Product successfully save ho gaya!','success');
  this.reset();
  document.getElementById('preview').textContent='📷 Photo preview';
 }catch(err){console.error(err);showMessage('⚠️ '+err.message,'danger');}
 finally{btn.disabled=false;btn.textContent='Product Save Karein →';}
});

async function logout(){await supabaseClient.auth.signOut();window.location.href='index.html';}
init();
</script>
</body>
</html>
