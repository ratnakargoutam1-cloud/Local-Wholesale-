<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Local Wholesale - Add Product</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .preview {
      width: 100%;
      height: 200px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 10px 0 20px;
      background: #fafafa;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-buttons button {
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .profit-box {
      margin: 15px 0;
      padding: 15px;
      border-radius: 10px;
      background: #f5f5f5;
      border: 1px solid #ddd;
    }

    .profit-box strong {
      font-size: 18px;
    }

    .profit-positive {
      color: green;
    }

    .profit-negative {
      color: red;
    }

    .commission-box {
      margin: 15px 0;
      padding: 15px;
      border-radius: 10px;
      background: #fff8e1;
      border: 1px solid #f0d77a;
    }

    #saveBtn:disabled {
      opacity: 0.6;
    }

  </style>
</head>


<body>

<main class="container">

  <section class="card">

    <!-- TOP BUTTONS -->

    <div class="top-buttons">

      <button
        type="button"
        onclick="goDashboard()"
      >
        ← Dashboard
      </button>

      <button
        type="button"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <h2>➕ Add Product</h2>


    <form id="productForm">

      <!-- ==========================
           PRODUCT PHOTO
      ========================== -->

      <label>Product Photo</label>

      <input
        type="file"
        id="photo"
        accept="image/*"
      >

      <div
        id="preview"
        class="preview"
      >
        📷 Photo Preview
      </div>


      <!-- ==========================
           CATEGORY
      ========================== -->

      <label>Category</label>

      <select
        id="category"
        required
      >

        <option value="">
          Category Select Karein
        </option>

        <option value="Kirana/Grocery">
          Kirana / Grocery
        </option>

        <option value="Cold Drinks/Beverages">
          Cold Drinks / Beverages
        </option>

        <option value="Cosmetics">
          Cosmetics
        </option>

        <option value="Stationery">
          Stationery
        </option>

        <option value="Electrical">
          Electrical
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <!-- ==========================
           PRODUCT NAME
      ========================== -->

      <label>Product Name</label>

      <input
        type="text"
        id="productName"
        placeholder="Jaise: Parle-G Biscuit"
        required
      >


      <!-- ==========================
           MRP
      ========================== -->

      <label>MRP (₹)</label>

      <input
        type="number"
        id="mrp"
        min="0"
        step="0.01"
        placeholder="635"
        required
      >


      <!-- ==========================
           WHOLESALE PRICE
      ========================== -->

      <label>Wholesale Price (₹)</label>

      <input
        type="number"
        id="price"
        min="0"
        step="0.01"
        placeholder="550"
        required
      >


      <!-- ==========================
           RETAILER SELLING PRICE
      ========================== -->

      <label>Retailer Selling Price (₹)</label>

      <input
        type="number"
        id="retailerSellingPrice"
        min="0"
        step="0.01"
        placeholder="600"
        required
      >


      <!-- PROFIT -->

      <div class="profit-box">

        <strong>
          💰 Retailer Profit:
          ₹<span id="profitAmount">0.00</span>
        </strong>

        <br>

        <span id="profitMessage">
          Wholesale Price aur Selling Price enter karein.
        </span>

      </div>


      <!-- ==========================
           SUGGESTED SELLING PRICE
      ========================== -->

      <label>
        Suggested Selling Price (₹)
      </label>

      <input
        type="number"
        id="suggestedSellingPrice"
        min="0"
        step="0.01"
        placeholder="600"
      >

      <small>
        💡 Retailer ko suggested selling price dikhaya ja sakta hai.
      </small>


      <!-- ==========================
           UNIT
      ========================== -->

      <label>Unit</label>

      <select
        id="unit"
        required
      >

        <option value="piece">
          Piece
        </option>

        <option value="packet">
          Packet
        </option>

        <option value="box">
          Box
        </option>

        <option value="kg">
          Kg
        </option>

        <option value="gram">
          Gram
        </option>

        <option value="litre">
          Litre
        </option>

        <option value="dozen">
          Dozen
        </option>

      </select>


      <!-- ==========================
           BOX QUANTITY
      ========================== -->

      <label>
        Box Quantity
      </label>

      <input
        type="number"
        id="boxQuantity"
        min="1"
        step="0.01"
        value="1"
        required
      >

      <small>
        📦 Example: 1 Box = 12 Packet, to yahan 12 dalein.
      </small>


      <!-- ==========================
           COMMISSION TYPE
      ========================== -->

      <label>
        Platform Commission Type
      </label>

      <select id="commissionType">

        <option value="fixed">
          Fixed ₹
        </option>

        <option value="percentage">
          Percentage %
        </option>

      </select>


      <!-- ==========================
           COMMISSION VALUE
      ========================== -->

      <label>
        Platform Commission
      </label>

      <input
        type="number"
        id="commissionValue"
        min="0"
        step="0.01"
        value="0"
        placeholder="8"
      >


      <!-- ==========================
           COMMISSION UNIT
      ========================== -->

      <label>
        Commission Applies Per
      </label>

      <select id="commissionUnit">

        <option value="unit">
          Unit / Piece
        </option>

        <option value="box">
          Box
        </option>

      </select>


      <div class="commission-box">

        💸 <strong>
          Platform Commission:
        </strong>

        <span id="commissionPreview">
          ₹0.00
        </span>

      </div>


      <!-- ==========================
           STOCK
      ========================== -->

      <label>Stock</label>

      <input
        type="number"
        id="stock"
        min="0"
        step="0.01"
        value="0"
        required
      >


      <!-- ==========================
           DESCRIPTION
      ========================== -->

      <label>Description</label>

      <textarea
        id="description"
        rows="4"
        placeholder="Product ki jankari..."
      ></textarea>


      <!-- ==========================
           SAVE
      ========================== -->

      <button
        type="submit"
        id="saveBtn"
        class="primary"
      >
        Product Save Karein →
      </button>

    </form>


    <p id="message"></p>

  </section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://izxvsvyvvtbaxtxgcfav.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

const BUCKET =
  "Product image";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let userId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("productForm");

const photo =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");

const saveBtn =
  document.getElementById("saveBtn");

const message =
  document.getElementById("message");


/* =====================================================
   IMAGE PREVIEW
===================================================== */

photo.addEventListener(
  "change",
  function () {

    const file =
      photo.files[0];


    if (!file) {

      preview.innerHTML =
        "📷 Photo Preview";

      return;
    }


    if (!file.type.startsWith("image/")) {

      preview.innerHTML =
        "⚠️ Sirf image select karein";

      photo.value = "";

      return;
    }


    const image =
      document.createElement("img");


    image.src =
      URL.createObjectURL(file);


    preview.innerHTML =
      "";


    preview.appendChild(image);

  }
);


/* =====================================================
   PROFIT CALCULATION
===================================================== */

function calculateProfit() {

  const wholesalePrice =
    Number(
      document.getElementById(
        "price"
      ).value
    ) || 0;


  const retailerSellingPrice =
    Number(
      document.getElementById(
        "retailerSellingPrice"
      ).value
    ) || 0;


  const profit =
    retailerSellingPrice -
    wholesalePrice;


  const profitAmount =
    document.getElementById(
      "profitAmount"
    );


  const profitMessage =
    document.getElementById(
      "profitMessage"
    );


  profitAmount.innerText =
    profit.toFixed(2);


  if (profit > 0) {

    profitAmount.className =
      "profit-positive";

    profitMessage.innerText =
      "✅ Retailer ko itna gross profit milega.";

    profitMessage.className =
      "profit-positive";

  }

  else if (profit < 0) {

    profitAmount.className =
      "profit-negative";

    profitMessage.innerText =
      "⚠️ Selling price wholesale price se kam hai.";

    profitMessage.className =
      "profit-negative";

  }

  else {

    profitAmount.className =
      "";

    profitMessage.innerText =
      "No profit";

    profitMessage.className =
      "";

  }

}


/* =====================================================
   COMMISSION CALCULATION
===================================================== */

function calculateCommission() {

  const commissionType =
    document.getElementById(
      "commissionType"
    ).value;


  const commissionValue =
    Number(
      document.getElementById(
        "commissionValue"
      ).value
    ) || 0;


  const wholesalePrice =
    Number(
      document.getElementById(
        "price"
      ).value
    ) || 0;


  let commission = 0;


  if (
    commissionType ===
    "percentage"
  ) {

    commission =
      wholesalePrice *
      commissionValue /
      100;

  }

  else {

    commission =
      commissionValue;

  }


  document.getElementById(
    "commissionPreview"
  ).innerText =
    "₹" +
    commission.toFixed(2);

}


/* =====================================================
   LIVE CALCULATION
===================================================== */

document.getElementById(
  "price"
).addEventListener(
  "input",
  function () {

    calculateProfit();
    calculateCommission();

  }
);


document.getElementById(
  "retailerSellingPrice"
).addEventListener(
  "input",
  calculateProfit
);


document.getElementById(
  "commissionType"
).addEventListener(
  "change",
  calculateCommission
);


document.getElementById(
  "commissionValue"
).addEventListener(
  "input",
  calculateCommission
);


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkUser() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    window.location.href =
      "index.html";

    return;

  }


  userId =
    user.id;


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();


  if (
    error ||
    !profile ||
    profile.role !== "wholesaler"
  ) {

    message.innerText =
      "⚠️ Ye page sirf wholesaler ke liye hai.";

    message.className =
      "error";


    form.style.display =
      "none";

  }

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

form.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();
    event.stopPropagation();


    message.innerText =
      "";

    saveBtn.disabled =
      true;

    saveBtn.innerText =
      "Saving...";


    try {

      /* ==========================
         FORM DATA
      ========================== */

      const category =
        document.getElementById(
          "category"
        ).value;


      const productName =
        document.getElementById(
          "productName"
        ).value.trim();


      const mrp =
        Number(
          document.getElementById(
            "mrp"
          ).value
        ) || 0;


      const price =
        Number(
          document.getElementById(
            "price"
          ).value
        ) || 0;


      const retailerSellingPrice =
        Number(
          document.getElementById(
            "retailerSellingPrice"
          ).value
        ) || 0;


      const suggestedSellingPrice =
        Number(
          document.getElementById(
            "suggestedSellingPrice"
          ).value
        ) || 0;


      const unit =
        document.getElementById(
          "unit"
        ).value;


      const boxQuantity =
        Number(
          document.getElementById(
            "boxQuantity"
          ).value
        ) || 1;


      const commissionType =
        document.getElementById(
          "commissionType"
        ).value;


      const commissionValue =
        Number(
          document.getElementById(
            "commissionValue"
          ).value
        ) || 0;


      const commissionUnit =
        document.getElementById(
          "commissionUnit"
        ).value;


      const stock =
        Number(
          document.getElementById(
            "stock"
          ).value
        ) || 0;


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      /* ==========================
         IMAGE UPLOAD
      ========================== */

      let imageUrl =
        null;


      const file =
        photo.files[0];


      if (file) {

        const extension =
          (
            file.name
              .split(".")
              .pop() ||
            "jpg"
          ).toLowerCase();


        const filePath =
          userId +
          "/" +
          crypto.randomUUID() +
          "." +
          extension;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .upload(
              filePath,
              file,
              {
                upsert: false,
                contentType: file.type
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        /* PUBLIC URL */

        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
              filePath
            );


        imageUrl =
          publicData.publicUrl;

      }


      /* ==========================
         INSERT PRODUCT
      ========================== */

      const {
        error: productError
      } =
        await supabaseClient
          .from("products")
          .insert({

            wholesaler_id:
              userId,

            category:
              category,

            product_name:
              productName,

            description:
              description ||
              null,

            mrp:
              mrp,

            price:
              price,

            retailer_selling_price:
              retailerSellingPrice,

            suggested_selling_price:
              suggestedSellingPrice,

            unit:
              unit,

            box_quantity:
              boxQuantity,

            commission_type:
              commissionType,

            commission_value:
              commissionValue,

            commission_unit:
              commissionUnit,

            stock:
              stock,

            image_url:
              imageUrl

          });


      if (productError) {

        throw productError;

      }


      /* ==========================
         SUCCESS
      ========================== */

      message.innerText =
        "✅ Product successfully save ho gaya!";

      message.className =
        "success";


      form.reset();


      /* Defaults after reset */

      document.getElementById(
        "boxQuantity"
      ).value = "1";


      document.getElementById(
        "commissionType"
      ).value = "fixed";


      document.getElementById(
        "commissionValue"
      ).value = "0";


      document.getElementById(
        "commissionUnit"
      ).value = "unit";


      document.getElementById(
        "stock"
      ).value = "0";


      preview.innerHTML =
        "📷 Photo Preview";


      calculateProfit();

      calculateCommission();

    }


    catch (error) {

      console.error(
        "PRODUCT ERROR:",
        error
      );


      message.innerText =
        "⚠️ " +
        (
          error.message ||
          "Product save nahi hua."
        );

      message.className =
        "error";

    }


    finally {

      saveBtn.disabled =
        false;

      saveBtn.innerText =
        "Product Save Karein →";

    }

  }
);


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard() {

  window.location.href =
    "wholesaler.html";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "index.html";

}


/* =====================================================
   START
===================================================== */

checkUser();

</script>

</body>
</html>
