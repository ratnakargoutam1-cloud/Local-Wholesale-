<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local Wholesale - Add Product</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#1f2937;
}

header{
    background:#166534;
    color:white;
    padding:16px;
}

header h2{
    margin:0;
    font-size:20px;
}

main{
    max-width:650px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px #0001;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#166534;
    color:white;
    font-weight:bold;
    font-size:16px;
    margin-top:16px;
}

button:disabled{
    opacity:.6;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.new-category-btn{
    background:#2563eb;
}

.hidden{
    display:none;
}

.note{
    font-size:13px;
    color:#6b7280;
    margin-top:5px;
}

.custom-category-box{
    margin-top:10px;
    padding:12px;
    background:#eff6ff;
    border-radius:12px;
    border:1px solid #bfdbfe;
}

.small-btn{
    margin-top:10px;
    padding:10px;
    font-size:14px;
}

#status{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    display:none;
}

.success{
    display:block!important;
    background:#ecfdf5;
    color:#166534;
}

.error{
    display:block!important;
    background:#fef2f2;
    color:#991b1b;
}
</style>
</head>

<body>

<header>
    <h2>➕ Add Product — Local Wholesale</h2>
</header>

<main>

<div class="card">

<label>Product Name *</label>

<input
    id="productName"
    type="text"
    maxlength="100"
    placeholder="Example: Parle-G Biscuit"
>


<label>Category *</label>

<select
    id="category"
    onchange="categoryChanged()"
>

<option value="">
    Select Category
</option>

</select>


<button
    type="button"
    class="new-category-btn small-btn"
    onclick="showNewCategory()"
>
    ➕ Category nahi mil rahi? New Category likhein
</button>


<!-- NEW CATEGORY -->

<div
    id="newCategoryBox"
    class="custom-category-box hidden"
>

<label>
    New Category Name
</label>

<input
    id="newCategoryName"
    type="text"
    maxlength="60"
    placeholder="Example: Plastic Household Items"
>

<div class="note">
    Sirf valid category name likhein. 2–60 characters.
</div>

<button
    type="button"
    class="small-btn"
    onclick="createNewCategory()"
>
    Add New Category
</button>

</div>


<!-- GROCERY SUBCATEGORY -->

<div
    id="groceryBox"
    class="hidden"
>

<label>
    Grocery Subcategory *
</label>

<select id="subcategory">

<option value="">
    Select Grocery Section
</option>

<option value="Biscuit">
    🍪 Biscuit
</option>

<option value="Snacks">
    🍿 Snacks
</option>

<option value="Namkeen">
    🥜 Namkeen
</option>

<option value="Chips">
    🥔 Chips
</option>

<option value="Other">
    📦 Other Grocery
</option>

</select>

</div>


<label>
    Description
</label>

<textarea
    id="description"
    maxlength="1000"
    placeholder="Brand, pack size, product details..."
></textarea>


<label>
    MRP (₹) *
</label>

<input
    id="mrp"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 10"
>


<label>
    Wholesale Price (₹) *
</label>

<input
    id="price"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 8"
>


<label>
    Unit *
</label>

<select id="unit">

<option value="piece">
    Piece
</option>

<option value="packet">
    Packet
</option>

<option value="box">
    Box
</option>

<option value="kg">
    Kg
</option>

<option value="gram">
    Gram
</option>

<option value="litre">
    Litre
</option>

<option value="ml">
    ML
</option>

</select>


<label>
    Box Quantity
</label>

<input
    id="boxQuantity"
    type="number"
    min="1"
    step="1"
    value="1"
>

<div class="note">
    Example: 1 Box = 20 Packets → 20 enter karein.
</div>


<label>
    Retailer Selling Price (₹)
</label>

<input
    id="retailerPrice"
    type="number"
    min="0"
    step="0.01"
    placeholder="Optional"
>


<label>
    Stock *
</label>

<input
    id="stock"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 100"
>


<label>
    Product Image
</label>

<input
    id="image"
    type="file"
    accept="image/jpeg,image/png,image/webp"
>

<div class="note">
    Product ki clear photo upload karein.
</div>


<button
    id="saveBtn"
    onclick="saveProduct()"
>
    Save Product
</button>


<button
    class="secondary"
    onclick="location.href='wholesaler.html'"
>
    Back to Dashboard
</button>


<div id="status"></div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://izxvsvyvvtbaxtxgcfav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;


/* =========================
   DEFAULT CATEGORIES
========================= */

const defaultCategories = [

    "Cold Drinks & Juices",
    "Parle Products",
    "Britannia Products",
    "Tata Products",
    "Toast & Petha",
    "Patanjali Products",
    "Daily Products",
    "Hindustani Products",
    "Reliance Products",
    "Namkeens & Chips",
    "Chocolates & Toffees",
    "Red Label",
    "Paan Corner",
    "Biscuits & Cookies",
    "Tea, Coffee & More",
    "Instant Food",
    "Personal Care",
    "Dry Fruits & Nuts",
    "Masala & Spices",
    "Rice, Dal & Pulses",
    "Atta, Flour & Grains",
    "Sugar, Salt & Sweeteners",
    "Edible Oil & Ghee",
    "Home Cleaning",
    "Household & Disposable",
    "Baby Care",
    "Beauty & Cosmetics",
    "Stationery",
    "Electrical",
    "Water & Packaged Drinks",
    "Sauces, Pickles & Spreads",
    "Bakery Products",
    "Pet Food & Care",
    "Other Grocery"

];


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(){

    const category =
        document.getElementById("category");

    category.innerHTML =
        `<option value="">Loading categories...</option>`;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("categories")
    .select("name,status")
    .eq("status","approved")
    .order("name");


    let names = [];


    if(!error && data){

        names =
            data
            .map(x => x.name)
            .filter(Boolean);

    }


    /*
       Safety fallback:
       Agar database mein category load
       nahi hui to default list bhi rahegi.
    */

    names =
        [
            ...defaultCategories,
            ...names
        ];


    /*
       Duplicate remove
    */

    names =
        [...new Map(
            names.map(
                x => [
                    x.toLowerCase(),
                    x
                ]
            )
        ).values()];


    category.innerHTML =
        `<option value="">Select Category</option>`;


    names.forEach(name => {

        const option =
            document.createElement("option");

        option.value =
            name;

        option.textContent =
            name;

        category.appendChild(option);

    });

}


/* =========================
   CATEGORY CHANGE
========================= */

function categoryChanged(){

    const category =
        document.getElementById("category").value;

    const groceryBox =
        document.getElementById("groceryBox");


    /*
       Grocery ke liye subcategory
    */

    if(
        category === "Kirana/Grocery" ||
        category === "Other Grocery"
    ){

        groceryBox.classList.remove("hidden");

    }else{

        groceryBox.classList.add("hidden");

        document.getElementById(
            "subcategory"
        ).value = "";

    }

}


/* =========================
   NEW CATEGORY UI
========================= */

function showNewCategory(){

    const box =
        document.getElementById(
            "newCategoryBox"
        );

    box.classList.toggle("hidden");

}


/* =========================
   CREATE NEW CATEGORY
========================= */

async function createNewCategory(){

    const input =
        document.getElementById(
            "newCategoryName"
        );

    const name =
        input.value
        .trim()
        .replace(/\s+/g," ");


    if(name.length < 2){

        showStatus(
            "❌ Category name kam se kam 2 characters ka hona chahiye.",
            "error"
        );

        return;
    }


    if(name.length > 60){

        showStatus(
            "❌ Category name maximum 60 characters ka ho sakta hai.",
            "error"
        );

        return;
    }


    /*
       Frontend basic security validation
    */

    const safePattern =
        /^[A-Za-z0-9 &'().\/-]+$/;


    if(!safePattern.test(name)){

        showStatus(
            "❌ Category name mein invalid characters hain.",
            "error"
        );

        return;
    }


    try{

        showStatus(
            "Category check ho rahi hai...",
            "success"
        );


        /*
           Secure database RPC
        */

        const {
            data,
            error
        } =
        await supabaseClient
        .rpc(
            "create_wholesaler_category",
            {
                p_name:name
            }
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.success !== true
        ){

            throw new Error(
                "Category create nahi hui."
            );

        }


        /*
           Category dropdown mein add
        */

        await loadCategories();


        const category =
            document.getElementById(
                "category"
            );


        category.value =
            name;


        categoryChanged();


        input.value = "";


        document
        .getElementById(
            "newCategoryBox"
        )
        .classList.add("hidden");


        showStatus(
            "✅ New category add ho gayi aur retailer category list mein available hai.",
            "success"
        );


    }catch(error){

        console.error(error);

        showStatus(
            "❌ " +
            (
                error.message ||
                "New category create nahi hui."
            ),
            "error"
        );

    }

}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        type;

}


/* =========================
   LOGIN CHECK
========================= */

async function init(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(
        error ||
        !data.session
    ){

        location.href =
            "index.html";

        return;
    }


    currentUser =
        data.session.user;


    const {
        data:profile,
        error:pError
    } =
    await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
        "id",
        currentUser.id
    )
    .single();


    if(
        pError ||
        !profile ||
        profile.role !== "wholesaler"
    ){

        alert(
            "Wholesaler account required."
        );

        location.href =
            "index.html";

        return;
    }


    /*
       Categories load
    */

    await loadCategories();

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

    const btn =
        document.getElementById(
            "saveBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "Saving...";


    try{

        const productName =
            document
            .getElementById(
                "productName"
            )
            .value
            .trim();


        const category =
            document
            .getElementById(
                "category"
            )
            .value;


        const subcategory =
            document
            .getElementById(
                "subcategory"
            )
            .value;


        const description =
            document
            .getElementById(
                "description"
            )
            .value
            .trim();


        const mrp =
            Number(
                document
                .getElementById(
                    "mrp"
                )
                .value || 0
            );


        const price =
            Number(
                document
                .getElementById(
                    "price"
                )
                .value || 0
            );


        const unit =
            document
            .getElementById(
                "unit"
            )
            .value;


        const boxQuantity =
            Number(
                document
                .getElementById(
                    "boxQuantity"
                )
                .value || 1
            );


        const retailerPrice =
            Number(
                document
                .getElementById(
                    "retailerPrice"
                )
                .value || 0
            );


        const stock =
            Number(
                document
                .getElementById(
                    "stock"
                )
                .value || 0
            );


        const file =
            document
            .getElementById(
                "image"
            )
            .files[0];


        /* =========================
           VALIDATION
        ========================= */

        if(
            !productName ||
            !category
        ){

            throw new Error(
                "Product name aur category select karein."
            );

        }


        if(productName.length > 100){

            throw new Error(
                "Product name maximum 100 characters ka ho sakta hai."
            );

        }


        if(
            mrp < 0 ||
            price < 0 ||
            stock < 0 ||
            retailerPrice < 0
        ){

            throw new Error(
                "MRP, price, retailer price aur stock sahi enter karein."
            );

        }


        if(
            category === "Kirana/Grocery" &&
            !subcategory
        ){

            throw new Error(
                "Grocery subcategory select karein."
            );

        }


        if(
            boxQuantity < 1
        ){

            throw new Error(
                "Box Quantity kam se kam 1 honi chahiye."
            );

        }


        /*
           Image security
        */

        if(file){

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];


            if(
                !allowedTypes.includes(
                    file.type
                )
            ){

                throw new Error(
                    "Sirf JPG, PNG ya WEBP image allowed hai."
                );

            }


            /*
               5 MB maximum
            */

            if(
                file.size >
                5 * 1024 * 1024
            ){

                throw new Error(
                    "Image maximum 5 MB ki ho sakti hai."
                );

            }

        }


        /* =========================
           IMAGE UPLOAD
        ========================= */

        let imageUrl = null;


        if(file){

            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const filePath =
                currentUser.id +
                "/" +
                crypto.randomUUID() +
                "_" +
                safeName;


            const {
                error:uploadError
            } =
            await supabaseClient
            .storage
            .from("Product image")
            .upload(
                filePath,
                file,
                {
                    upsert:false,
                    contentType:file.type
                }
            );


            if(uploadError){

                throw uploadError;

            }


            const {
                data:publicData
            } =
            supabaseClient
            .storage
            .from("Product image")
            .getPublicUrl(
                filePath
            );


            imageUrl =
                publicData.publicUrl;

        }


        /* =========================
           INSERT PRODUCT
        ========================= */

        const {
            error
        } =
        await supabaseClient
        .from("products")
        .insert({

            wholesaler_id:
                currentUser.id,

            category:
                category,

            subcategory:
                (
                    category ===
                    "Kirana/Grocery" ||
                    category === "Other Grocery"
                )
                ? subcategory
                : null,

            product_name:
                productName,

            description:
                description ||
                null,

            mrp:
                mrp,

            price:
                price,

            unit:
                unit,

            box_quantity:
                boxQuantity,

            retailer_selling_price:
                retailerPrice,

            suggested_selling_price:
                retailerPrice,

            stock:
                stock,

            image_url:
                imageUrl,

            is_active:
                true

        });


        if(error){

            throw error;

        }


        showStatus(
            "✅ Product successfully save ho gaya!",
            "success"
        );


        /* =========================
           RESET
        ========================= */

        document
        .getElementById(
            "productName"
        )
        .value = "";


        document
        .getElementById(
            "description"
        )
        .value = "";


        document
        .getElementById(
            "mrp"
        )
        .value = "";


        document
        .getElementById(
            "price"
        )
        .value = "";


        document
        .getElementById(
            "retailerPrice"
        )
        .value = "";


        document
        .getElementById(
            "stock"
        )
        .value = "";


        document
        .getElementById(
            "image"
        )
        .value = "";


        document
        .getElementById(
            "subcategory"
        )
        .value = "";


        document
        .getElementById(
            "category"
        )
        .value = "";


        categoryChanged();


    }catch(error){

        console.error(error);

        showStatus(
            "❌ " +
            (
                error.message ||
                "Product save nahi hua."
            ),
            "error"
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
            "Save Product";

    }

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
