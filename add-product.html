<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Wholesale - Add Product</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#1f2937;
}

header{
    background:#166534;
    color:white;
    padding:16px;
}

header h2{
    margin:0;
    font-size:20px;
}

main{
    max-width:650px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px #0001;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#166534;
    color:white;
    font-weight:bold;
    font-size:16px;
    margin-top:16px;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.hidden{
    display:none;
}

.note{
    font-size:13px;
    color:#6b7280;
    margin-top:5px;
}

#status{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    display:none;
}

.success{
    display:block!important;
    background:#ecfdf5;
    color:#166534;
}

.error{
    display:block!important;
    background:#fef2f2;
    color:#991b1b;
}
</style>
</head>

<body>

<header>
    <h2>➕ Add Product — Local Wholesale</h2>
</header>

<main>

<div class="card">

<label>Product Name *</label>

<input
    id="productName"
    type="text"
    placeholder="Example: Parle-G Biscuit"
>


<label>Category *</label>

<select
    id="category"
    onchange="categoryChanged()"
>

<option value="">
    Select Category
</option>

<option value="Kirana/Grocery">
    🛒 Kirana / Grocery
</option>

<option value="Cold Drinks/Beverages">
    🥤 Cold Drinks / Beverages
</option>

<option value="Cosmetics">
    💄 Cosmetics
</option>

<option value="Stationery">
    ✏️ Stationery
</option>

<option value="Electrical">
    💡 Electrical
</option>

<option value="Other">
    📦 Other
</option>

</select>


<!-- GROCERY SUBCATEGORY -->

<div
    id="groceryBox"
    class="hidden"
>

<label>
    Grocery Subcategory *
</label>

<select id="subcategory">

<option value="">
    Select Grocery Section
</option>

<option value="Biscuit">
    🍪 Biscuit
</option>

<option value="Snacks">
    🍿 Snacks
</option>

<option value="Namkeen">
    🥜 Namkeen
</option>

<option value="Chips">
    🥔 Chips
</option>

<option value="Other">
    📦 Other Grocery
</option>

</select>

</div>


<label>
    Description
</label>

<textarea
    id="description"
    placeholder="Brand, pack size, product details..."
></textarea>


<label>
    MRP (₹) *
</label>

<input
    id="mrp"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 10"
>


<label>
    Wholesale Price (₹) *
</label>

<input
    id="price"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 8"
>


<label>
    Unit *
</label>

<select id="unit">

<option value="piece">
    Piece
</option>

<option value="packet">
    Packet
</option>

<option value="box">
    Box
</option>

<option value="kg">
    Kg
</option>

<option value="gram">
    Gram
</option>

<option value="litre">
    Litre
</option>

<option value="ml">
    ML
</option>

</select>


<label>
    Box Quantity
</label>

<input
    id="boxQuantity"
    type="number"
    min="1"
    step="1"
    value="1"
>

<div class="note">
    Example: 1 Box = 20 Packets → 20 enter karein.
</div>


<label>
    Retailer Selling Price (₹)
</label>

<input
    id="retailerPrice"
    type="number"
    min="0"
    step="0.01"
    placeholder="Optional"
>


<label>
    Stock *
</label>

<input
    id="stock"
    type="number"
    min="0"
    step="0.01"
    placeholder="Example: 100"
>


<label>
    Product Image
</label>

<input
    id="image"
    type="file"
    accept="image/*"
>

<div class="note">
    Product ki clear photo upload karein.
</div>


<button
    id="saveBtn"
    onclick="saveProduct()"
>
    Save Product
</button>


<button
    class="secondary"
    onclick="location.href='wholesaler.html'"
>
    Back to Dashboard
</button>


<div id="status"></div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://izxvsvyvvtbaxtxgcfav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;


/* =========================
   CATEGORY CHANGE
========================= */

function categoryChanged(){

    const category =
        document.getElementById("category").value;

    const groceryBox =
        document.getElementById("groceryBox");

    if(category === "Kirana/Grocery"){

        groceryBox.classList.remove("hidden");

    }else{

        groceryBox.classList.add("hidden");

        document.getElementById(
            "subcategory"
        ).value = "";

    }

}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        type;

}


/* =========================
   LOGIN CHECK
========================= */

async function init(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(
        error ||
        !data.session
    ){

        location.href =
            "index.html";

        return;
    }


    currentUser =
        data.session.user;


    const {
        data:profile,
        error:pError
    } =
    await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
        "id",
        currentUser.id
    )
    .single();


    if(
        pError ||
        !profile ||
        profile.role !== "wholesaler"
    ){

        alert(
            "Wholesaler account required."
        );

        location.href =
            "index.html";

    }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

    const btn =
        document.getElementById(
            "saveBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "Saving...";


    try{

        const productName =
            document
            .getElementById(
                "productName"
            )
            .value
            .trim();


        const category =
            document
            .getElementById(
                "category"
            )
            .value;


        const subcategory =
            document
            .getElementById(
                "subcategory"
            )
            .value;


        const description =
            document
            .getElementById(
                "description"
            )
            .value
            .trim();


        const mrp =
            Number(
                document
                .getElementById(
                    "mrp"
                )
                .value || 0
            );


        const price =
            Number(
                document
                .getElementById(
                    "price"
                )
                .value || 0
            );


        const unit =
            document
            .getElementById(
                "unit"
            )
            .value;


        const boxQuantity =
            Number(
                document
                .getElementById(
                    "boxQuantity"
                )
                .value || 1
            );


        const retailerPrice =
            Number(
                document
                .getElementById(
                    "retailerPrice"
                )
                .value || 0
            );


        const stock =
            Number(
                document
                .getElementById(
                    "stock"
                )
                .value || 0
            );


        const file =
            document
            .getElementById(
                "image"
            )
            .files[0];


        /* VALIDATION */

        if(
            !productName ||
            !category
        ){

            throw new Error(
                "Product name aur category select karein."
            );

        }


        if(
            mrp < 0 ||
            price < 0 ||
            stock < 0
        ){

            throw new Error(
                "MRP, price aur stock sahi enter karein."
            );

        }


        if(
            category === "Kirana/Grocery" &&
            !subcategory
        ){

            throw new Error(
                "Grocery subcategory select karein."
            );

        }


        if(
            boxQuantity < 1
        ){

            throw new Error(
                "Box Quantity kam se kam 1 honi chahiye."
            );

        }


        /* =========================
           IMAGE UPLOAD
        ========================= */

        let imageUrl = null;


        if(file){

            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const filePath =
                currentUser.id +
                "/" +
                Date.now() +
                "_" +
                safeName;


            const {
                error:uploadError
            } =
            await supabaseClient
            .storage
            .from("Product image")
            .upload(
                filePath,
                file,
                {
                    upsert:false,
                    contentType:file.type
                }
            );


            if(uploadError){

                throw uploadError;

            }


            const {
                data:publicData
            } =
            supabaseClient
            .storage
            .from("Product image")
            .getPublicUrl(
                filePath
            );


            imageUrl =
                publicData.publicUrl;

        }


        /* =========================
           INSERT PRODUCT
        ========================= */

        const {
            error
        } =
        await supabaseClient
        .from("products")
        .insert({

            wholesaler_id:
                currentUser.id,

            category:
                category,

            subcategory:
                category ===
                "Kirana/Grocery"
                ? subcategory
                : null,

            product_name:
                productName,

            description:
                description ||
                null,

            mrp:
                mrp,

            price:
                price,

            unit:
                unit,

            box_quantity:
                boxQuantity,

            retailer_selling_price:
                retailerPrice,

            suggested_selling_price:
                retailerPrice,

            stock:
                stock,

            image_url:
                imageUrl,

            is_active:
                true

        });


        if(error){

            throw error;

        }


        showStatus(
            "✅ Product successfully save ho gaya!",
            "success"
        );


        /* RESET */

        document
        .getElementById(
            "productName"
        )
        .value = "";


        document
        .getElementById(
            "description"
        )
        .value = "";


        document
        .getElementById(
            "mrp"
        )
        .value = "";


        document
        .getElementById(
            "price"
        )
        .value = "";


        document
        .getElementById(
            "retailerPrice"
        )
        .value = "";


        document
        .getElementById(
            "stock"
        )
        .value = "";


        document
        .getElementById(
            "image"
        )
        .value = "";


        document
        .getElementById(
            "subcategory"
        )
        .value = "";


        document
        .getElementById(
            "category"
        )
        .value = "";


        categoryChanged();


    }catch(error){

        console.error(error);

        showStatus(
            "❌ " +
            (
                error.message ||
                "Product save nahi hua."
            ),
            "error"
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
            "Save Product";

    }

}


/* START */

init();

</script>

</body>
</html>
