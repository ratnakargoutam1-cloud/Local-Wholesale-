<!DOCTYPE html>
<html lang="hi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Local Wholesale - Cart</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 15px;
    }

    .header {
      background: white;
      padding: 15px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .back {
      border: none;
      background: #2563eb;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .cart-item {
      background: white;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cart-img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 10px;
      background: #eee;
      padding: 3px;
    }

    .details {
      flex: 1;
    }

    .name {
      font-weight: bold;
    }

    .shop {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 7px;
      background: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
    }

    .remove {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 6px;
    }

    .summary {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-top: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 9px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }

    .place-order {
      width: 100%;
      border: none;
      background: #16a34a;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .place-order:disabled {
      background: #999;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 14px;
    }

    .message {
      text-align: center;
      padding: 15px;
    }

    .limit-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .cart-item {
        align-items: flex-start;
      }

      .cart-img {
        width: 65px;
        height: 65px;
      }

      .header {
        gap: 10px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <strong>
      🛒 My Cart
    </strong>

    <button
      class="back"
      onclick="location.href='retailer.html'"
    >
      ← Products
    </button>

  </div>


  <div id="cart"></div>


  <div
    id="summary"
    style="display:none;"
    class="summary"
  >

    <div class="row">
      <span>Items</span>

      <strong id="itemsCount">
        0
      </strong>
    </div>


    <div class="row">

      <span>
        Subtotal
      </span>

      <strong id="subtotal">
        ₹0.00
      </strong>

    </div>


    <div class="row total">

      <span>
        Total
      </span>

      <strong id="total">
        ₹0.00
      </strong>

    </div>


    <div class="limit-box">

      ℹ️ हर wholesaler के लिए minimum order
      <strong>₹1,000</strong>
      और maximum order
      <strong>₹10,000</strong>
      है।

      <br><br>

      अगर cart में अलग-अलग wholesalers के products हैं,
      तो प्रत्येक wholesaler का order अलग बनेगा।

    </div>


    <button
      id="placeOrderBtn"
      class="place-order"
      onclick="placeOrder()"
    >
      ✅ Place Order
    </button>

  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://izxvsvyvvtbaxtxgcfav.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let cart = [];


/* =========================
   START
========================= */

async function init() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    location.href =
      "index.html";

    return;
  }


  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();


  if (
    !profile ||
    profile.role !== "retailer"
  ) {

    document.getElementById("cart")
      .innerHTML =
      '<div class="empty">⚠️ यह page केवल Retailer के लिए है।</div>';

    return;
  }


  loadCart();

}


/* =========================
   LOAD CART
========================= */

function loadCart() {

  try {

    cart =
      JSON.parse(
        localStorage.getItem(
          "localWholesaleCart"
        ) || "[]"
      );

  } catch (error) {

    cart = [];

  }


  cart =
    cart.map(item => ({

      ...item,

      qty:
        Math.max(
          1,
          Number(item.qty || 1)
        ),

      price:
        Number(item.price || 0),

      unit:
        item.unit ||
        item.selected_unit ||
        "piece"

    }));


  renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart() {

  const box =
    document.getElementById("cart");


  const summary =
    document.getElementById("summary");


  if (cart.length === 0) {

    box.innerHTML = `

      <div class="empty">

        <div
          style="font-size:45px;"
        >
          🛒
        </div>

        <h3>
          Cart खाली है
        </h3>

        <p>
          पहले कोई product Cart में add करें।
        </p>

        <button
          class="back"
          onclick="location.href='retailer.html'"
        >
          Products देखें
        </button>

      </div>

    `;


    summary.style.display =
      "none";


    return;
  }


  summary.style.display =
    "block";


  box.innerHTML =
    cart.map(
      (item, index) => {

        const image =
          item.image_url

          ?

          `
          <img
            class="cart-img"
            src="${escapeHtml(
              item.image_url
            )}"
            alt="Product"
          >
          `

          :

          `
          <div
            class="cart-img"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:30px;
            "
          >
            📦
          </div>
          `;


        const unit =
          item.unit ||
          item.selected_unit ||
          "piece";


        const price =
          Number(
            item.price || 0
          );


        const qty =
          Number(
            item.qty || 0
          );


        const lineTotal =
          price * qty;


        return `

          <div class="cart-item">

            ${image}


            <div class="details">

              <div class="name">

                ${escapeHtml(
                  item.product_name
                )}

              </div>


              <div class="price">

                ₹${price.toFixed(2)}
                /
                ${escapeHtml(unit)}

              </div>


              <div
                style="
                  margin-top:4px;
                  font-size:14px;
                "
              >

                Product Total:
                <strong>
                  ₹${lineTotal.toFixed(2)}
                </strong>

              </div>


              <div class="quantity">

                <button
                  onclick="changeQty(${index}, -1)"
                >
                  −
                </button>


                <strong>
                  ${qty}
                </strong>


                <button
                  onclick="changeQty(${index}, 1)"
                >
                  +
                </button>

              </div>


              <button
                class="remove"
                onclick="removeItem(${index})"
              >
                🗑 Remove
              </button>

            </div>

          </div>

        `;

      }
    ).join("");


  updateSummary();

}


/* =========================
   QUANTITY
========================= */

function changeQty(
  index,
  amount
) {

  if (!cart[index]) {
    return;
  }


  cart[index].qty =
    Number(
      cart[index].qty || 0
    ) + amount;


  if (
    cart[index].qty <= 0
  ) {

    cart.splice(
      index,
      1
    );

  }


  saveCart();

}


/* =========================
   REMOVE
========================= */

function removeItem(index) {

  cart.splice(
    index,
    1
  );


  saveCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

  localStorage.setItem(
    "localWholesaleCart",
    JSON.stringify(cart)
  );


  renderCart();

}


/* =========================
   SUMMARY
========================= */

function updateSummary() {

  let count = 0;

  let total = 0;


  cart.forEach(item => {

    const qty =
      Number(
        item.qty || 0
      );

    const price =
      Number(
        item.price || 0
      );


    count += qty;

    total +=
      price * qty;

  });


  document.getElementById(
    "itemsCount"
  ).innerText =
    count;


  document.getElementById(
    "subtotal"
  ).innerText =
    "₹" +
    total.toFixed(2);


  document.getElementById(
    "total"
  ).innerText =
    "₹" +
    total.toFixed(2);

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder() {

  if (
    cart.length === 0
  ) {

    alert(
      "Cart खाली है।"
    );

    return;
  }


  const btn =
    document.getElementById(
      "placeOrderBtn"
    );


  btn.disabled =
    true;


  btn.innerText =
    "Order place हो रहा है...";


  try {

    /* =====================
       USER
    ===================== */

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      location.href =
        "index.html";

      return;
    }


    /* =====================
       GROUP BY WHOLESALER
    ===================== */

    const groups = {};


    cart.forEach(item => {

      if (
        !item.wholesaler_id
      ) {
        return;
      }


      if (
        !groups[
          item.wholesaler_id
        ]
      ) {

        groups[
          item.wholesaler_id
        ] = [];

      }


      groups[
        item.wholesaler_id
      ].push(item);

    });


    const wholesalerIds =
      Object.keys(groups);


    if (
      wholesalerIds.length === 0
    ) {

      throw new Error(
        "Cart में wholesaler information नहीं मिली।"
      );

    }


    /* =====================
       CREATE EACH ORDER
    ===================== */

    for (
      const wholesalerId
      of wholesalerIds
    ) {

      const items =
        groups[
          wholesalerId
        ];


      let total = 0;


      items.forEach(item => {

        total +=
          Number(
            item.price || 0
          ) *
          Number(
            item.qty || 0
          );

      });


      total =
        Number(
          total.toFixed(2)
        );


      /* =====================
         MINIMUM
      ===================== */

      if (
        total < 1000
      ) {

        throw new Error(
          `Minimum order ₹1,000 है। इस wholesaler का order अभी ₹${total.toFixed(2)} है।`
        );

      }


      /* =====================
         MAXIMUM
      ===================== */

      if (
        total > 10000
      ) {

        throw new Error(
          `Maximum order ₹10,000 है। इस wholesaler का order ₹${total.toFixed(2)} है।`
        );

      }


      /* =====================
         CREATE ORDER
      ===================== */

      const {
        data: order,
        error: orderError
      } =
        await supabaseClient
          .from("orders")
          .insert({

            retailer_id:
              user.id,

            wholesaler_id:
              wholesalerId,

            total:
              total,

            status:
              "pending",

            delivery_status:
              "pending",

            payment_status:
              "cod"

          })
          .select()
          .single();


      if (orderError) {

        throw orderError;

      }


      /* =====================
         ORDER ITEMS
      ===================== */

      const orderItems =
        items.map(item => {

          const unit =
            item.unit ||
            item.selected_unit ||
            "piece";


          return {

            order_id:
              order.id,

            product_id:
              item.id,

            product_name:
              item.product_name,

            image_url:
              item.image_url ||
              null,

            quantity:
              Number(
                item.qty || 0
              ),

            price:
              Number(
                item.price || 0
              ),

            unit:
              unit

          };

        });


      const {
        error: itemError
      } =
        await supabaseClient
          .from("order_items")
          .insert(
            orderItems
          );


      if (itemError) {

        throw itemError;

      }

    }


    /* =====================
       CLEAR CART
    ===================== */

    localStorage.removeItem(
      "localWholesaleCart"
    );


    cart = [];


    alert(
      "🎉 Order successfully place हो गया!"
    );


    location.href =
      "retailer.html";

  }


  catch (error) {

    console.error(
      error
    );


    alert(
      "❌ Order place नहीं हुआ:\n" +
      error.message
    );


    btn.disabled =
      false;


    btn.innerText =
      "✅ Place Order";

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&":
            "&amp;",

          "<":
            "&lt;",

          ">":
            "&gt;",

          '"':
            "&quot;",

          "'":
            "&#039;"

        }[char];

      }
    );

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
