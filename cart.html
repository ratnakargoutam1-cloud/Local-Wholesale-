<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Local Wholesale - Cart</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 15px;
    }

    .header {
      background: white;
      padding: 15px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .back {
      border: none;
      background: #2563eb;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .cart-item {
      background: white;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cart-img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .details {
      flex: 1;
    }

    .name {
      font-weight: bold;
    }

    .shop {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 7px;
      background: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
    }

    .remove {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 6px;
    }

    .summary {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-top: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 9px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }

    .place-order {
      width: 100%;
      border: none;
      background: #16a34a;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .place-order:disabled {
      background: #999;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 14px;
    }

    .message {
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <strong>🛒 My Cart</strong>

    <button
      class="back"
      onclick="location.href='retailer.html'"
    >
      ← Products
    </button>
  </div>

  <div id="cart"></div>

  <div
    id="summary"
    style="display:none;"
    class="summary"
  >

    <div class="row">
      <span>Items</span>
      <strong id="itemsCount">0</strong>
    </div>

    <div class="row">
      <span>Subtotal</span>
      <strong id="subtotal">₹0.00</strong>
    </div>

    <div class="row total">
      <span>Total</span>
      <strong id="total">₹0.00</strong>
    </div>

    <button
      id="placeOrderBtn"
      class="place-order"
      onclick="placeOrder()"
    >
      ✅ Place Order
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://izxvsvyvvtbaxtxgcfav.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let cart = [];


/* =========================
   START
========================= */

async function init() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    location.href = "index.html";

    return;
  }


  const {
    data: profile
  } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();


  if (!profile || profile.role !== "retailer") {

    document.getElementById("cart").innerHTML =
      '<div class="empty">⚠️ यह page केवल Retailer के लिए है।</div>';

    return;
  }


  loadCart();

}


/* =========================
   LOAD CART
========================= */

function loadCart() {

  cart =
    JSON.parse(
      localStorage.getItem(
        "localWholesaleCart"
      ) || "[]"
    );


  renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart() {

  const box =
    document.getElementById("cart");

  const summary =
    document.getElementById("summary");


  if (cart.length === 0) {

    box.innerHTML = `
      <div class="empty">
        <div style="font-size:45px;">🛒</div>

        <h3>Cart खाली है</h3>

        <p>पहले कोई product Cart में add करें।</p>

        <button
          class="back"
          onclick="location.href='retailer.html'"
        >
          Products देखें
        </button>
      </div>
    `;

    summary.style.display = "none";

    return;
  }


  summary.style.display = "block";


  box.innerHTML =
    cart.map((item, index) => {

      const image =
        item.image_url

        ?

        `<img
          class="cart-img"
          src="${escapeHtml(item.image_url)}"
        >`

        :

        `<div class="cart-img"
             style="
               display:flex;
               align-items:center;
               justify-content:center;
               font-size:30px;
             ">
           📦
         </div>`;


      return `

        <div class="cart-item">

          ${image}

          <div class="details">

            <div class="name">
              ${escapeHtml(
                item.product_name
              )}
            </div>

            <div class="price">
              ₹${Number(
                item.price
              ).toFixed(2)}
              /
              ${escapeHtml(
                item.unit || "piece"
              )}
            </div>

            <div class="quantity">

              <button
                onclick="changeQty(${index}, -1)"
              >
                −
              </button>

              <strong>
                ${item.qty}
              </strong>

              <button
                onclick="changeQty(${index}, 1)"
              >
                +
              </button>

            </div>

            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              🗑 Remove
            </button>

          </div>

        </div>

      `;

    }).join("");


  updateSummary();

}


/* =========================
   QUANTITY
========================= */

function changeQty(index, amount) {

  cart[index].qty += amount;


  if (cart[index].qty <= 0) {

    cart.splice(index, 1);

  }


  saveCart();

}


/* =========================
   REMOVE
========================= */

function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

  localStorage.setItem(
    "localWholesaleCart",
    JSON.stringify(cart)
  );

  renderCart();

}


/* =========================
   SUMMARY
========================= */

function updateSummary() {

  let count = 0;

  let total = 0;


  cart.forEach(item => {

    count += Number(item.qty);

    total +=
      Number(item.price) *
      Number(item.qty);

  });


  document.getElementById(
    "itemsCount"
  ).innerText = count;


  document.getElementById(
    "subtotal"
  ).innerText =
    "₹" + total.toFixed(2);


  document.getElementById(
    "total"
  ).innerText =
    "₹" + total.toFixed(2);

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder() {

  if (cart.length === 0) {

    alert("Cart खाली है।");

    return;
  }


  const btn =
    document.getElementById(
      "placeOrderBtn"
    );


  btn.disabled = true;

  btn.innerText =
    "Order place हो रहा है...";


  try {

    /* USER */

    const {
      data: {
        user
      }
    } = await supabaseClient.auth.getUser();


    if (!user) {

      location.href = "index.html";

      return;
    }


    /*
      एक Cart में अलग-अलग wholesaler
      हो सकते हैं।

      इसलिए wholesaler के हिसाब से
      अलग order बनाएंगे।
    */

    const groups = {};


    cart.forEach(item => {

      if (!groups[item.wholesaler_id]) {

        groups[item.wholesaler_id] = [];

      }

      groups[item.wholesaler_id].push(item);

    });


    for (
      const wholesalerId
      of Object.keys(groups)
    ) {

      const items =
        groups[wholesalerId];


      let total = 0;


      items.forEach(item => {

        total +=
          Number(item.price) *
          Number(item.qty);

      });


      /* CREATE ORDER */

      const {
        data: order,
        error: orderError
      } = await supabaseClient
        .from("orders")
        .insert({

          retailer_id:
            user.id,

          wholesaler_id:
            wholesalerId,

          total:
            total,

          status:
            "pending",

          delivery_status:
            "pending",

          payment_status:
            "cod"

        })
        .select()
        .single();


      if (orderError) {

        throw orderError;

      }


      /* ORDER ITEMS */

      const orderItems =
        items.map(item => ({

          order_id:
            order.id,

          product_id:
            item.id,

          product_name:
            item.product_name,

          quantity:
            Number(item.qty),

          price:
            Number(item.price)

        }));


      const {
        error: itemError
      } = await supabaseClient
        .from("order_items")
        .insert(orderItems);


      if (itemError) {

        throw itemError;

      }

    }


    /* CLEAR CART */

    localStorage.removeItem(
      "localWholesaleCart"
    );


    cart = [];


    alert(
      "🎉 Order successfully place हो गया!"
    );


    location.href =
      "retailer.html";


  }

  catch (error) {

    console.error(error);


    alert(
      "❌ Order place नहीं हुआ:\n" +
      error.message
    );


    btn.disabled = false;

    btn.innerText =
      "✅ Place Order";

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
